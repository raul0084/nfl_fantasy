[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-fantasy-ml-optimizer"
version = "0.1.0"
description = "Leakage-safe NFL fantasy football projections, lineup optimization, and waiver analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NFL Fantasy ML Optimizer contributors" }]
dependencies = [
  "polars>=1.20,<3.0",
  "nflreadpy>=0.1.5,<0.2.0",
  "duckdb>=1.1,<2.0",
  "lightgbm>=4.5,<5.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=18.0,<25.0",
  "pydantic>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
  "PyYAML>=6.0,<7.0",
  "requests>=2.32,<3.0",
  "scikit-learn>=1.5,<2.0",
  "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
